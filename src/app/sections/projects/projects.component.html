<section id="projects" class="section-pad bg-b">
  <div class="container">
    <div class="section-head">
      <div class="eyebrow" data-reveal>Selected Work</div>
      <h2 data-reveal>A showroom of systems I've engineered.</h2>
    </div>
    <div class="projects-grid" id="projects-grid">
      @for (p of items; track p.num) {
        <article class="project-card">
          <div class="p-top">
            <span class="p-num">{{ p.num }}</span>
            <span class="p-cat">{{ p.cat }}</span>
          </div>
          <h4>{{ p.title }}</h4>
          <p>{{ p.desc }}</p>
          <div class="p-tech">
            @for (t of p.tech; track t) {
              <span>{{ t }}</span>
            }
          </div>
          <a href="#contact" class="p-link">View Project <i data-lucide="arrow-up-right"></i></a>
        </article>
      }
    </div>
  </div>
</section>
