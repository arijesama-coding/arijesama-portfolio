<section id="stack" class="section-pad bg-b">
  <div class="container">
    <div class="section-head">
      <div class="eyebrow" data-reveal>The Technology Stack</div>
      <h2 data-reveal>Tools I use to turn ideas into production-ready systems.</h2>
    </div>
    <div class="stack-grid" id="stack-grid">
      @for (s of items; track s.name; let i = $index) {
        <div
          class="stack-card"
          [class.is-active]="isActive(i)"
          [class.is-dimmed]="activeIndex !== null && !isActive(i)"
          [style.--tech-color]="getMeta(s.name).color"
          [attr.data-float]="floatValue(i)"
          (mouseenter)="onMouseEnter(i)"
          (mouseleave)="onMouseLeave()"
          (click)="onCardClick($event, i)"
        >
          <div class="icon-wrap"><i [class]="s.icon"></i></div>
          <div>
            <div class="name">{{ s.name }}</div>
            <div class="cat">{{ s.cat }}</div>
          </div>

          @if (isActive(i)) {
            <div class="stack-info">
              <ul>
                @for (p of getMeta(s.name).points; track p) {
                  <li>{{ p }}</li>
                }
              </ul>
            </div>
          }
        </div>
      }
    </div>
  </div>
</section>
