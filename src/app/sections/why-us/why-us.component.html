<section id="why" class="section-pad bg-a">
  <div class="container">
    <div class="section-head">
      <div class="eyebrow" data-reveal>{{ i18n.t('why.eyebrow') }}</div>
      <h2 data-reveal>{{ i18n.t('why.title') }}</h2>
    </div>
    <div class="why-grid" id="why-grid">
      @for (w of items; track w.num) {
        <div class="why-card">
          <div class="why-num">{{ w.num }}</div>
          <h4>{{ i18n.pick(w.title) }}</h4>
          <p>{{ i18n.pick(w.desc) }}</p>
        </div>
      }
    </div>
  </div>
</section>
