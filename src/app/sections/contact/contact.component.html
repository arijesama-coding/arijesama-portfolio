<section id="contact" class="section-pad bg-a">
  <div class="container contact-grid">
    <div class="contact-info">
      <div class="eyebrow" data-reveal>{{ i18n.t('contact.eyebrow') }}</div>
      <h2 style="margin-top:20px;" data-reveal>{{ i18n.t('contact.title') }}</h2>
      <p data-reveal>
        {{ i18n.t('contact.desc') }}
      </p>
      <div class="contact-details" data-reveal>
        <a href="mailto:arijesa.ma@gmail.com"><i data-lucide="mail"></i> hello arijesama.dev</a>
        <a href="#"><i data-lucide="map-pin"></i> {{ i18n.t('contact.remote') }}</a>
      </div>
      <div class="social-row" data-reveal>
        <a href="https://github.com/arijesama-coding/" aria-label="GitHub"><i class="fab fa-github"></i></a>
        <a href="https://www.linkedin.com/in/manampiniaina-arijesa-577964386/" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
        <a href="https://www.facebook.com/share/1C5WBrPLA6/" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
      </div>
    </div>
    <form id="contact-form" data-reveal novalidate (submit)="onSubmit($event)">
      <div class="form-field">
        <input type="text" id="f-name" name="name" required autocomplete="off"
               [(ngModel)]="name" (input)="onInput($any($event.target))">
        <label for="f-name">{{ i18n.t('contact.name') }}</label>
        <div class="field-line"></div>
      </div>
      <div class="form-field">
        <input type="email" id="f-email" name="email" required autocomplete="off"
               [(ngModel)]="email" (input)="onInput($any($event.target))">
        <label for="f-email">{{ i18n.t('contact.email') }}</label>
        <div class="field-line"></div>
      </div>
      <div class="form-field">
        <input type="text" id="f-project" name="project" autocomplete="off"
               [(ngModel)]="project" (input)="onInput($any($event.target))">
        <label for="f-project">{{ i18n.t('contact.project') }}</label>
        <div class="field-line"></div>
      </div>
      <div class="form-field">
        <textarea id="f-message" name="message" required
                  [(ngModel)]="message" (input)="onInput($any($event.target))"></textarea>
        <label for="f-message">{{ i18n.t('contact.message') }}</label>
        <div class="field-line"></div>
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">{{ i18n.t('contact.send') }}</span>
        <span *ngIf="isLoading" class="btn-loading">
          <i class="fa-solid fa-spinner fa-spin"></i>
          {{ i18n.t('contact.sending') }}
        </span>
      </button>
      <div id="form-status" [class.error]="sendError">{{ status }}</div>
    </form>
    <div class="booking-cta" data-reveal>
      <div class="booking-cta-icon"><i data-lucide="calendar-check"></i></div>
      <div class="booking-cta-text">
        <strong>{{ i18n.t('contact.bookingTitle') }}</strong>
        <span>{{ i18n.t('contact.bookingDesc') }}</span>
      </div>
      <a class="btn btn-secondary booking-cta-btn"
         href="https://cal.com/arijesama-dev/30min"
         target="_blank" rel="noopener noreferrer">
        <i data-lucide="calendar-plus"></i>
        {{ i18n.t('contact.bookingCta') }}
      </a>
    </div>
  </div>

  <div class="contact-notification" *ngIf="notification" [class.success]="notification.type === 'success'" [class.error]="notification.type === 'error'">
    <i class="fa-solid" [class.fa-circle-check]="notification.type === 'success'" [class.fa-circle-exclamation]="notification.type === 'error'"></i>
    <span>{{ notification.message }}</span>
    <button type="button" class="contact-notification-close" (click)="dismissNotification()" [attr.aria-label]="i18n.t('contact.closeNotification')">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>
</section>
