<section id="contact" class="section-pad bg-a">
  <div class="container contact-grid">
    <div class="contact-info">
      <div class="eyebrow" data-reveal>Contact</div>
      <h2 style="margin-top:20px;" data-reveal>Let’s talk.</h2>
      <p data-reveal>
        Full product build, technical audit, or a system that needs to grow without breaking.
        Tell me what you’re dealing with.
      </p>
      <div class="contact-details" data-reveal>
        <a href="mailto:arijesa.ma@gmail.com"><i data-lucide="mail"></i> hello arijesama.dev</a>
        <a href="#"><i data-lucide="map-pin"></i> Available for remote work worldwide</a>
      </div>
      <div class="social-row" data-reveal>
        <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
        <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
        <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      </div>
    </div>
    <form id="contact-form" data-reveal novalidate (submit)="onSubmit($event)">
      <div class="form-field">
        <input type="text" id="f-name" name="name" required autocomplete="off"
               [(ngModel)]="name" (input)="onInput($any($event.target))">
        <label for="f-name">Name</label>
        <div class="field-line"></div>
      </div>
      <div class="form-field">
        <input type="email" id="f-email" name="email" required autocomplete="off"
               [(ngModel)]="email" (input)="onInput($any($event.target))">
        <label for="f-email">Email</label>
        <div class="field-line"></div>
      </div>
      <div class="form-field">
        <input type="text" id="f-project" name="project" autocomplete="off"
               [(ngModel)]="project" (input)="onInput($any($event.target))">
        <label for="f-project">Project</label>
        <div class="field-line"></div>
      </div>
      <div class="form-field">
        <textarea id="f-message" name="message" required
                  [(ngModel)]="message" (input)="onInput($any($event.target))"></textarea>
        <label for="f-message">Message</label>
        <div class="field-line"></div>
      </div>
      <button type="submit" class="btn btn-primary">Send Message</button>
      <div id="form-status">{{ status }}</div>
    </form>
  </div>
</section>
