<section id="showroom">
  <div class="showroom-grid" data-parallax="0.1"></div>
  <div class="showroom-glow" data-parallax="0.15"></div>
  <div class="showroom-objects">
    <div class="sr-object sr-o1" data-parallax="0.2"></div>
    <div class="sr-object sr-o2" data-parallax="-0.15"></div>
    <div class="sr-object sr-o3" data-parallax="0.3"></div>
    <div class="sr-object sr-o4" data-parallax="-0.25"></div>
  </div>
  <div class="container showroom-content">
    <div class="eyebrow" data-reveal>{{ i18n.t('showroom.eyebrow') }}</div>
    <h2 data-reveal>{{ i18n.t('showroom.title') }}</h2>
    <p data-reveal>
      {{ i18n.t('showroom.desc') }}
    </p>
  </div>
</section>
